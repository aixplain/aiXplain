description_file=README.md
# The file is `LICENSE` (no extension). The old `LICENSE.rst` pattern matched
# nothing ("Pattern 'LICENSE.rst' did not match any files") and only "worked"
# because the setuptools-scm git sweep pulled LICENSE into the sdist anyway.
# With that sweep gone, the wrong pattern would silently ship an Apache-2.0
# distribution with no licence file at all (ENG-3543).
license_files=LICENSE
