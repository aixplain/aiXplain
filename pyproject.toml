# aixplain/pyproject.toml
[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["aixplain", "tests"]
namespaces = true

[project]
name = "aiXplain"
version = "0.2.47"
description = "aiXplain SDK adds AI functions to software."
readme = "README.md"
requires-python = ">=3.9, <4"
license = { text = "Apache License, Version 2.0: http://www.apache.org/licenses/LICENSE-2.0" }
authors = [
  {email = "ahmet@aixplain.com"},
  {email = "hadi@aixplain.com"},
  {email = "kadir.pekel@aixplain.com"},
  {email = "zaina.abushaban@aixplain.com"}
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "Babel>=2.12.0",
    "requests>=2.1.0",
    "tqdm>=4.1.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "validators>=0.20.0",
    "filetype>=1.2.0",
    "click>=7.1.2",
    "PyYAML>=6.0.1",
    "dataclasses-json>=0.5.2",
    "Jinja2==3.1.6",
    "sentry-sdk>=1.0.0",
    "pydantic>=2.10.6",
    "filelock>=3.0.0",
    "twine>=6.2.0",
    "pre-commit>=4.3.0",
]

[project.urls]
Homepage = "https://github.com/aixplain/aiXplain"
Documentation = "https://github.com/aixplain/pipelines/tree/main/docs"

[project.scripts]
aixplain = "aixplain.cli_groups:run_cli"

[project.optional-dependencies]
model-builder = [
    "model-interfaces~=0.0.2"
]
test = [
    "pytest>=6.1.0",
    "docker>=6.1.3",
    "requests-mock>=1.11.0",
    "pytest-mock>=3.10.0",
    "pytest-rerunfailures>=16.0",
    "pytest-xdist",
    # Exercised by the agent_evaluator / eval_experiment plotting tests, which
    # used to `pytest.importorskip("plotly")` and therefore never ran (ENG-3431).
    "plotly>=5.18.0",
]

[tool.coverage.run]
# Measure the product, not the test suite. `--source=.` also picks up `tests/`
# (which ships as a package, see [tool.setuptools.packages.find]) and inflates
# the headline figure.
source = ["aixplain"]
omit = [
    "tests/*",
    "aixplain/v2/enums_include.py",  # auto-generated
]
relative_files = true  # keeps coverage.xml paths portable for CI reporters
branch = false  # statement coverage only for now

[tool.coverage.report]
show_missing = true
skip_covered = false
# NOTE: `fail_under` is deliberately NOT set here. The threshold is passed on
# the CI command line (`coverage report --fail-under=$COVERAGE_FLOOR`) so the
# gate is visible in the workflow and does not fail local/pre-commit runs
# mid-refactor.
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]
