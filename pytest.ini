[pytest]
addopts = --import-mode=importlib --strict-markers
testpaths =
    tests
markers =
    functional: end-to-end test that needs platform credentials and network.
    slow: test long enough to be worth selecting away from.
    destructive: test that mutates or deletes shared/remote state.
    flaky: test whose failure is retried by pytest-rerunfailures.
filterwarnings =
    error::aixplain._compat.AixplainV1DeprecationWarning
asyncio_mode = auto