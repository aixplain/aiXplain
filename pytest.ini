[pytest]
# --strict-markers is a no-op on pytest 9.0.x (an unregistered marker only warns
# there); 8.x -- CI's Python 3.9 leg -- and 9.1+ enforce it. Strictness that does
# not depend on the pytest version: tests/unit/test_marker_registration.py.
addopts = --import-mode=importlib --strict-markers
testpaths =
    tests
markers =
    flaky: test whose failure is retried by pytest-rerunfailures.
