repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0 # Use the latest version
    hooks:
      - id: trailing-whitespace
        exclude: ^docs/
      - id: end-of-file-fixer
        exclude: ^docs/
      - id: check-merge-conflict
      - id: check-added-large-files

  # Secret scanning (ENG-3686). Catches a credential in the *staged diff*, which
  # is the only moment it can still be kept out of history. `--staged` means this
  # hook is a no-op under `pre-commit run --all-files`, so CI additionally scans
  # the whole tree -- see the "Scan the full tree for secrets" step in
  # .github/workflows/pre-commit.yaml. Rules and allowlists live in .gitleaks.toml.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.12
    hooks:
      - id: ruff
        args: [--fix]
        files: ^aixplain/v2/
      - id: ruff-format
        files: ^aixplain/v2/

  - repo: local
    hooks:
      - id: pytest-check
        name: pytest-check
        # Coverage scope lives in pyproject.toml ([tool.coverage.run]); `--source=.`
        # measured the test files too and inflated the figure. The floor is only
        # enforced in CI, so a local run is never blocked mid-refactor.
        entry: coverage run -m pytest tests/unit
        language: python
        pass_filenames: false
        types: [python]
        always_run: true
        additional_dependencies:
          # `[toml]` extra required to read [tool.coverage.run] from pyproject.toml
          # on Python < 3.11; plain `coverage` hard-errors there.
          - coverage[toml]
          - pytest
          - pytest-mock
          - pytest-rerunfailures
          - pytest-xdist
          - requests-mock
          - plotly>=5.18.0  # keeps the plotting tests from silently skipping here too
          - Babel>=2.12.0
          - requests>=2.1.0
          - tqdm>=4.1.0
          - pandas>=2.0.0
          - python-dotenv>=1.0.0
          - validators>=0.20.0
          - filetype>=1.2.0
          - click>=7.1.2
          - PyYAML>=6.0.1
          - dataclasses-json>=0.5.2
          - Jinja2==3.1.6
          - sentry-sdk>=1.0.0
          - pydantic>=2.10.6
          - filelock>=3.0.0
          # tests/unit/test_generator.py renders the generated modules, and the
          # render step shells out to `python -m ruff format`. Pinned to the `rev`
          # above and to the `test` extra in pyproject.toml (ENG-3435).
          - ruff==0.12.12
