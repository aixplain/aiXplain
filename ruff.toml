line-length = 120
indent-width = 4

[format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[lint]
select = ["D"]
ignore = []
extend-safe-fixes = []

[lint.per-file-ignores]
# Test modules are format-checked only. `D` is the only selected rule set and
# test docstrings are not held to the public-API pydocstyle rules (AGENTS.md),
# so `ruff check` reports nothing for tests/.
"tests/**/*.py" = ["D"]

[lint.isort]
known-first-party = ["src"]

[lint.pydocstyle]
convention = "google"
