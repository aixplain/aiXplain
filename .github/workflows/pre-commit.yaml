name: Pre-commit Checks

on:
  push:
    branches:
      - '**'
  # BUG-1454: a push to a fork never starts a workflow in this repository, so
  # without this trigger a fork PR ran no ruff, no unit hook and no secret scan
  # -- and once `pre-commit` is a required context, every fork PR would wait
  # forever on a check that never reports. `pull_request` (never
  # `pull_request_target`) runs the fork's code with no secrets and a read-only
  # token, and nothing below needs more. Same-repo PRs therefore run twice (push
  # + PR). That is deliberate: skipping the PR run with a job-level `if:` would
  # report a *skipped* `pre-commit` check, and a skipped check satisfies a
  # required context even while the push run is red.
  pull_request:

# Mirrors main.yaml: only PR runs cancel each other (the newest commit on a PR
# re-runs everything the superseded run would have). Every other event gets a
# group of its own, so a push run always keeps its own result, and a push run
# and its PR run never cancel each other -- a cancelled run is a failed check.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request'
    && format('pr-{0}', github.event.pull_request.number)
    || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege (ENG-3428): `pre-commit run --all-files` executes hook code
# from the third-party repos pinned in .pre-commit-config.yaml, plus the repo's
# own pytest suite. None of it writes to the repository, so a read-only token is
# all this job should ever hold.
permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: 'pip'

      # The `gitleaks` pre-commit hook only sees the staged diff, so under
      # `pre-commit run --all-files` below it scans nothing. This step is what
      # actually satisfies "a secret scanner runs on every push" (ENG-3686): it
      # walks the whole working tree, using the same rules and allowlists from
      # .gitleaks.toml. Keep GITLEAKS_VERSION in step with the `rev` pinned for
      # the hook in .pre-commit-config.yaml, and GITLEAKS_SHA256 in step with the
      # linux_x64 line of that release's gitleaks_<version>_checksums.txt.
      - name: Scan the full tree for secrets
        env:
          GITLEAKS_VERSION: "8.28.0"
          GITLEAKS_SHA256: "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          # Refuse to run a binary that is not the pinned release.
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          # `dir` (not `git`) so the scan covers the checked-out tree rather than
          # a commit range; on a first push the range would be empty.
          /tmp/gitleaks dir . --config .gitleaks.toml --redact --verbose --no-banner

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"
          pip install pre-commit coverage

      # No TEAM_API_KEY (ENG-3683). The `pytest-check` hook runs `tests/unit`,
      # which is credential-free by design (ENG-3431), so the key was only ever
      # exposed to the third-party hook code this job also executes. If this job
      # ever starts failing on a missing key, the regression is a unit test that
      # has grown a backend dependency -- not this workflow.
      - name: Run pre-commit hooks
        env:
          # The gitleaks hook is staged-diff only, so under --all-files it would
          # build Go from source just to scan nothing. The step above already
          # scans the whole tree.
          SKIP: gitleaks
        run: pre-commit run --all-files
